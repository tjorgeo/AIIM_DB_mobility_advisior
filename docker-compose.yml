services:
  backend:
    # Explicit local tag: avoids Docker Compose's directory-derived image name and
    # lets a rebuild replace the application image deterministically.
    image: aiim-mobility-advisor-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiim_backend
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./database:/app/database
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
    ports:
      - "8000:8000"

  frontend:
    image: aiim-mobility-advisor-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiim_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # Vite dev-server proxies /api to the backend container (see frontend/vite.config.js)
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"

  db:
    image: postgres:16
    container_name: aiim_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
