[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-moveoptimizer"
version = "0.1.0"
description = "DB MoveOptimizer - University GPT API with LangGraph Workflow"
requires-python = ">=3.11"
authors = [
    {name = "AIIM DB Mobility Advisor Team"}
]
license = {text = "MIT"}

dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "langgraph>=0.0.1",
    "langgraph-cli[inmem]>=0.1.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
include = ["langgraph_agent.py"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
